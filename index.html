<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

      theme: {
        extend: {
          fontFamily: {
            heading: ["'neue-haas-grotesk-display'", "'Instrument Serif'", "serif"],
            hero: ["'Inter'", "'neue-haas-grotesk-display'", "sans-serif"],

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.25);
      --radius: 9999px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #000; color: #fff; -webkit-font-smoothing: antialiased; }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .liquid-glass-strong {
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,rgba(255,255,255,0.5) 0%,rgba(255,255,255,0.2) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.2) 80%,rgba(255,255,255,0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    /* Apple-style motion tokens: critically damped (no overshoot) + momentum (slight bounce) */
    :root {
      --spring: cubic-bezier(0.32, 0.72, 0, 1);          /* iOS drawer curve — gesture-driven surfaces */
      --spring-bounce: cubic-bezier(0.2, 1.25, 0.4, 1);  /* damping ~0.8, only after momentum */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);        /* entrances and exits */
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);    /* movement already on screen */
      --d-press: 140ms;   /* press feedback */
      --d-ui: 220ms;      /* hovers, small state changes */
      --d-panel: 280ms;   /* expanding panels, dialogs */
      --d-enter: 450ms;   /* section reveals */
      --d-hero: 700ms;    /* the one authored moment */
      --resp: 0.4s;
      --resp-fast: 0.28s;
    }
    /* Feedback on pointer-down, never only on release */
    a, button, [role="button"] { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    a:active, button:active, [role="button"]:active { transform: scale(0.97); transition: transform var(--d-press) var(--ease-out); }

    /* Reduced motion: gentler, non-vestibular equivalents — never zero feedback */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *:not(.ow-track), *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 200ms !important;
      }
      /* the portfolio marquee keeps drifting: it is the content, not decoration */
      a:active, button:active, [role="button"]:active { transform: none; opacity: 0.7; }
    }
    /* Reduced transparency: frostier, solid surfaces instead of glass */
    @media (prefers-reduced-transparency: reduce) {
      .liquid-glass, .liquid-glass-strong {
        background: rgba(24, 24, 24, 0.96);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }
    /* Higher contrast: near-solid with a defined border */
    @media (prefers-contrast: more) {
      .liquid-glass, .liquid-glass-strong {
        background: rgba(16, 16, 16, 0.98);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
      .liquid-glass::before, .liquid-glass-strong::before { display: none; }
    }
    ::selection { background: rgba(255,255,255,0.85); color: #000; }
    ::-moz-selection { background: rgba(255,255,255,0.85); color: #000; }
    input, textarea { caret-color: #fff; }
    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid rgba(255,255,255,0.9);
      outline-offset: 3px;
      border-radius: 6px;
    }
    a { color: #fff; text-decoration-color: rgba(255,255,255,0.35); text-underline-offset: 0.18em; }
    a:hover { text-decoration-color: rgba(255,255,255,0.8); }
    ::placeholder { color: rgba(255,255,255,0.38); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    video { display: block; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useRef, useEffect, useState } = React;

    // ── Icons ──────────────────────────────────────────────────────────────
    function IconArrowUpRight({ size = 16, className = "" }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" /></svg>);
    }
    function IconZap({ size = 20, className = "" }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>);
    }
    function IconPalette({ size = 20, className = "" }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="13.5" cy="6.5" r=".5" fill="currentColor" /><circle cx="17.5" cy="10.5" r=".5" fill="currentColor" /><circle cx="8.5" cy="7.5" r=".5" fill="currentColor" /><circle cx="6.5" cy="12.5" r=".5" fill="currentColor" /><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" /></svg>);
    }
    function IconBarChart3({ size = 20, className = "" }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18" /><path d="M18 17V9" /><path d="M13 17V5" /><path d="M8 17v-3" /></svg>);
    }
    function IconShield({ size = 20, className = "" }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>);
    }

    // ── BlurText ───────────────────────────────────────────────────────────
    function BlurText({ text, className = "", delay = 120, tag = "span", rootMargin = "0px 0px -120px 0px", serifLast = false, serifWords = [], style = {} }) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setVisible(true); }, { threshold: 0.1, rootMargin });
        observer.observe(el);
        return () => observer.disconnect();
      }, []);
      const words = text.split(" ");
      const Tag = tag;
      return (
        <Tag ref={ref} className={className} style={{ display: "block", ...style }}>
          {words.map((word, i) => (
            <span key={i} style={{ display: "inline-block", opacity: visible ? 1 : 0, filter: visible ? "blur(0px)" : "blur(12px)", transform: visible ? "translateY(0px)" : "translateY(30px)", transition: `opacity 0.55s var(--ease-out) ${i * delay}ms, filter 0.55s var(--ease-out) ${i * delay}ms, transform 0.55s var(--ease-out) ${i * delay}ms`, marginRight: i === words.length - 1 ? 0 : "0.28em", ...((serifLast && i === words.length - 1) || serifWords.includes(word) ? { fontFamily: "'Instrument Serif', serif", fontWeight: 400, fontStyle: "italic", fontSize: "1.1em", letterSpacing: "0.01em", position: "relative" } : {}) }}>
              {word}
            </span>
          ))}
        </Tag>
      );
    }

    // ── CountUpText ────────────────────────────────────────────────────────
    function CountUpText({ value = 10000000000, suffix = "+", className = "", duration = 1900, inline = false }) {
      const ref = useRef(null);
      const [n, setN] = useState(0);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold: 0.1 });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      useEffect(() => {
        if (!visible) return;
        let raf, start;
        const step = (t) => {
          if (!start) start = t;
          const p = Math.min((t - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 7);
          setN(Math.floor(value * eased));
          if (p < 1) raf = requestAnimationFrame(step);
          else setN(value);
        };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [visible]);
      return (
        <span ref={ref} className={className} style={{ display: inline ? "inline-block" : "block", position: "relative", textAlign: "center", fontVariantNumeric: "tabular-nums", opacity: visible ? 1 : 0, filter: visible ? "blur(0px)" : "blur(10px)", transition: "opacity 1.1s cubic-bezier(0.22,1,0.36,1), filter 1.1s cubic-bezier(0.22,1,0.36,1)" }}>
          <span style={{ visibility: "hidden" }}>{value.toLocaleString("de-DE")}{suffix}</span>
          <span style={{ position: "absolute", left: 0, right: 0, top: 0, textAlign: "center", whiteSpace: "nowrap" }}>
            {n.toLocaleString("de-DE")}
            <span style={{ opacity: n >= value ? 1 : 0, transition: "opacity var(--d-ui) var(--ease-out)" }}>{suffix}</span>
          </span>
        </span>
      );
    }

    // ── useIsMobile ────────────────────────────────────────────────────────
    function useIsMobile(bp = 768) {
      const [m, setM] = useState(() => window.innerWidth < bp);
      useEffect(() => {
        const mq = window.matchMedia(`(max-width: ${bp - 1}px)`);
        const on = (e) => setM(e.matches);
        mq.addEventListener("change", on);
        return () => mq.removeEventListener("change", on);
      }, [bp]);
      return m;
    }

    // ── FadeIn ─────────────────────────────────────────────────────────────
    // Nothing below the hero may arrive before the hero's own sequence has finished.
    const HERO_SETTLED = 2600; // ms after load: hero's last element lands at ~2100, then a beat
    const startedAt = performance.now();

    function FadeIn({ children, delay = 0, className = "", threshold = 0.1, rootMargin = "0px 0px -80px 0px" }) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        let timer;
        const observer = new IntersectionObserver(([entry]) => {
          if (!entry.isIntersecting) return;
          const wait = HERO_SETTLED - (performance.now() - startedAt);
          if (wait > 0) timer = setTimeout(() => setVisible(true), wait);
          else setVisible(true);
        }, { threshold, rootMargin });
        observer.observe(el);
        return () => { observer.disconnect(); clearTimeout(timer); };
      }, []);
      return (
        <div ref={ref} className={className} style={{ opacity: visible ? 1 : 0, transition: `opacity var(--d-enter) var(--ease-out) ${delay}ms` }}>
          {children}
        </div>
      );
    }

    // ── HLSVideo ───────────────────────────────────────────────────────────
    function HLSVideo({ src, className = "", desaturate = false, style = {}, poster }) {
      const videoRef = useRef(null);
      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;
        if (window.Hls && window.Hls.isSupported()) {
          const hls = new window.Hls({ autoStartLoad: true, lowLatencyMode: false });
          hls.loadSource(src);
          hls.attachMedia(video);
          hls.on(window.Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
          return () => hls.destroy();
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = src;
          video.play().catch(() => {});
        }
      }, [src]);
      return (<video ref={videoRef} autoPlay loop muted playsInline poster={poster} className={className} style={{ ...(desaturate ? { filter: "saturate(0)" } : {}), ...style }} />);
    }

    // ── SectionBadge ──────────────────────────────────────────────────────
    function SectionBadge({ children }) {
      return (<span className="liquid-glass rounded-full px-3.5 py-1 text-xs font-bold text-white font-hero inline-block tracking-wide uppercase">{children}</span>);
    }

    // ── Navbar ─────────────────────────────────────────────────────────────
    function Navbar() {
      const [active, setActive] = useState("Home");
      const pillWrapRef = useRef(null);
      const [pill, setPill] = useState({ left: 0, width: 0 });
      useEffect(() => {
        const measure = () => {
          const wrap = pillWrapRef.current;
          if (!wrap) return;
          const el = wrap.querySelector(`[data-nav="${active}"]`);
          if (!el) return;
          setPill({ left: el.offsetLeft, width: el.offsetWidth });
        };
        measure();
        window.addEventListener("resize", measure);
        const t = setTimeout(measure, 300); // after webfonts settle
        return () => { window.removeEventListener("resize", measure); clearTimeout(t); };
      }, [active]);
      useEffect(() => {
        const sections = [["Home", null],["Services","capabilities"],["Portfolio","our-work"],["FAQ","faq"],["Contacts","contact"]];
        const onScroll = () => {
          const scrollY = window.scrollY + 120;
          const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 100;
          if (atBottom) { setActive("Contacts"); return; }
          let current = "Home";
          for (const [label, id] of sections) {
            if (!id) continue;
            const el = document.getElementById(id);
            if (el && el.offsetTop <= scrollY) current = label;
          }
          setActive(current);
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);
      return (
        <nav className="fixed top-4 left-0 right-0 z-50 px-8 lg:px-16 flex items-center justify-between py-3">
          <a href="#" onClick={(e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); }} className="flex items-center cursor-pointer">
            <img src="uploads/LOGO LATO STUDIO CON SCRITTA@2x-8.png" alt="Lato Studio" style={{ height: "34px", width: "auto", objectFit: "contain", display: "block" }} />
          </a>
          <div ref={pillWrapRef} className="hidden md:flex liquid-glass rounded-full px-1.5 py-1 items-center gap-1 relative">
            <span aria-hidden="true" style={{
              position: "absolute", top: "4px", bottom: "4px", left: 0, width: `${pill.width}px`,
              transform: `translateX(${pill.left}px)`, background: "#fff", borderRadius: "9999px",
              opacity: pill.width ? 1 : 0, pointerEvents: "none",
              transition: "transform var(--d-ui) var(--ease-in-out), width var(--d-ui) var(--ease-in-out), opacity var(--d-ui) var(--ease-out)"
            }} />
            {[["Home","#"],["Services","#capabilities"],["Portfolio","#our-work"],["FAQ","#faq"],["Contacts","#contact"]].map(([label, href]) => (
              <a key={label} href={href} data-nav={label} className="px-3 py-2 text-sm font-medium font-body rounded-full relative"
                style={{ color: active === label ? "#000" : "rgba(255,255,255,0.75)", transition: "color var(--d-ui) var(--ease-out)" }}>{label}</a>
            ))}
          </div>
          <a href="#contact" className="md:hidden flex items-center gap-1 bg-white text-black rounded-full px-3.5 py-1.5 text-sm font-medium font-body">Contacts</a>
        </nav>
      );
    }

    // ── CreatorsCarousel ───────────────────────────────────────────────────
    const creators = [
      { name: "Ninna e Matti",   subs: "2,6M subscribers",  img: "https://yt3.googleusercontent.com/KFZVoYTrTISUy1POqnB0KBs_P3YUCrlt0DxHgH6JDf6Vx7NIaQ_pxpQGAN9zAxqkzFLM7Ll5=s900-c-k-c0x00ffffff-no-rj" },
      { name: "CO.RA. SpA",      subs: "3K subscribers",    img: "https://yt3.googleusercontent.com/NA1myIhCafnuJAwO7x0G8akgGfPpJYXZfNwFDbMsT1zOEBnqQmRP10GxmkE41RO8GXE9LGacKg=s900-c-k-c0x00ffffff-no-rj" },
      { name: "Riccardo Danile",  subs: "86K subscribers",   img: "https://yt3.googleusercontent.com/jTM0frbs-hnADmfN0IYr4ibknOq3EG_8JMrIMR6GcS7oU-4Tr7Uvxd2fylRHzC7auAyDVKiksw=s900-c-k-c0x00ffffff-no-rj" },
      { name: "Marcello Ascani", subs: "1,06M subscribers", img: "uploads/marcello.jpg" },
      { name: "Breakfast Club",  subs: "307K subscribers",  img: "https://i.scdn.co/image/ab6761610000e5ebd87575f2800fa708e0e06c23" },
      { name: "Giada e Mamma",   subs: "740K subscribers",  img: "https://yt3.googleusercontent.com/phWRKiXE8F9Cm4vwg5-1Jz8PvSDN4mgfRBi_UXO_N-vcEQEPoJrr2YcUAWAu6B2HzCw0PuGn=s900-c-k-c0x00ffffff-no-rj" },
      { name: "Jack Nobile",     subs: "1,48M subscribers", img: "https://jacknobile.it/wp-content/uploads/elementor/thumbs/fotoprofilo11-1-r5g2ocy52o1kk4wb8onbbyzqpmg0j5ce7joof33ioo.jpg" },
      { name: "Hyde",            subs: "865K subscribers",  img: "https://yt3.googleusercontent.com/MLvaKadLY7DCVqOg_J_TgzESuYCWudKCfMkD0Up_kLqIQ-bUDbiP95rcNVCY8CLoxdWE-c8ItQ=s160-c-k-c0x00ffffff-no-rj" },
      { name: "AstroViktor",     subs: "114K subscribers",  img: "https://yt3.googleusercontent.com/BbmIGgqUlKg5zGloH-iVH7Zyy6kba5Tm4xfc-_k84FSOldbKCtYCQdN69BRK84XeT3-AL3D9DQ=s160-c-k-c0x00ffffff-no-rj" },
      { name: "Ascensore",       subs: "12,8K subscribers", img: "https://yt3.googleusercontent.com/AVqp_OHPe6oOXXR8Co-CCigOvosPxhV5VKLvSe8XBz4lyreFWPncOgvn60THkn7ci1VICkuR=s160-c-k-c0x00ffffff-no-rj" },

      { name: "Piccoli Mondi",   subs: "13,9K subscribers", img: "https://yt3.googleusercontent.com/qBTL3FrzNiOsotBPcx_1v_-v4GwyiTi75fO6o9KkTjCUkikVSNzyA33qjOuMOwGNfn4h2HoHmA=s160-c-k-c0x00ffffff-no-rj" },
      { name: "Piz",             subs: "170K subscribers",  img: "https://yt3.googleusercontent.com/a30cmSLe9QXHTMfZswSHb3gpBvnvt2hW_-2dAi4JHOVzzNMNA4j0saiCPYYORk53zK4gpbPg=s160-c-k-c0x00ffffff-no-rj" },
      { name: "Andrea Muzii",    subs: "245K subscribers",  img: "https://yt3.googleusercontent.com/ytc/AIdro_lyQzE5qg9qAwCsMsdr_rauz5jXgX19RfpBlqJ4QKri5n4=s160-c-k-c0x00ffffff-no-rj" },

    function CreatorsCarousel() {
      const items = [...creators, ...creators, ...creators];
      const trackRef = useRef(null);
      const wrapRef = useRef(null);
      const currentX = useRef(0);
      const targetX = useRef(0);
      const rafRef = useRef(null);
      const isMobile = window.innerWidth < 768;

      // one card + its gap, measured from the DOM — never a hardcoded guess
      const pitch = () => {
        const t = trackRef.current;
        if (!t || t.children.length < 2) return 240;
        return t.children[1].offsetLeft - t.children[0].offsetLeft;
      };
      const snap = () => {
        const p = pitch();
        targetX.current = Math.round(targetX.current / p) * p;
      };
      // land on a card boundary, always
      const scroll = (dir) => {
        const p = pitch();
        targetX.current = (Math.round(targetX.current / p) + dir) * p;
      };

      // Pointer drag: works with a mouse in a narrow window and with a finger
      const pdrag = useRef({ id: null, x: 0, active: false });
      const onPointerDown = (e) => {
        if (e.pointerType === "touch") return; // touch is handled below, 1:1
        pdrag.current = { id: e.pointerId, x: e.clientX, active: true };
        e.currentTarget.setPointerCapture(e.pointerId);
      };
      const onPointerMove = (e) => {
        if (!pdrag.current.active || e.pointerId !== pdrag.current.id) return;
        targetX.current += pdrag.current.x - e.clientX;
        pdrag.current.x = e.clientX;
      };
      const onPointerUp = (e) => {
        if (!pdrag.current.active) return;
        pdrag.current.active = false;
        snap();
        try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
      };

      useEffect(() => {
        let touchStartX = 0, touchStartY = 0, isSwiping = false, started = false;
        const onTouchStart = (e) => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; isSwiping = false; };
        const onTouchMove = (e) => {
          if (!trackRef.current) return;
          const dx = touchStartX - e.touches[0].clientX;
          const dy = Math.abs(touchStartY - e.touches[0].clientY);
          if (!isSwiping && dy > Math.abs(dx) * 1.5) return;
          isSwiping = true;
          e.preventDefault();
          targetX.current += dx * 1.5;
          touchStartX = e.touches[0].clientX;
        };

        const period = () => {
          const t = trackRef.current;
          if (!t || t.children.length < creators.length + 1) return 0;
          // exact width of one copy, gap included
          return t.children[creators.length].offsetLeft - t.children[0].offsetLeft;
        };

        // start inside the middle copy so there is room in both directions
        const seed = () => {
          const p = period();
          if (!p || started) return;
          started = true;
          currentX.current = p;
          targetX.current = p;
        };

        const animate = () => {
          seed();
          currentX.current += (targetX.current - currentX.current) * 0.06;
          if (trackRef.current) {
            const p = period();
            if (p > 0) {
              if (currentX.current >= p * 2) { currentX.current -= p; targetX.current -= p; }
              else if (currentX.current < 0) { currentX.current += p; targetX.current += p; }
            }
            trackRef.current.style.transform = `translateX(-${currentX.current}px)`;
          }
          rafRef.current = requestAnimationFrame(animate);
        };

        const el = wrapRef.current;
        el.addEventListener("touchstart", onTouchStart, { passive: true });
        el.addEventListener("touchmove", onTouchMove, { passive: false });
        rafRef.current = requestAnimationFrame(animate);
        return () => {
          el.removeEventListener("touchstart", onTouchStart);
          el.removeEventListener("touchmove", onTouchMove);
          cancelAnimationFrame(rafRef.current);
        };
      }, []);

      const ArrowBtn = ({ dir }) => (
        <button onClick={() => scroll(dir)}
          className="hidden md:flex liquid-glass-strong rounded-full items-center justify-center flex-shrink-0 hover:bg-white/20 transition-colors"

            {dir === -1 ? <polyline points="15 18 9 12 15 6"/> : <polyline points="9 6 15 12 9 18"/>}
          </svg>
        </button>
      );

      return (
        <div className="w-full flex items-center gap-4 px-4 md:px-8">
          <ArrowBtn dir={-1} />
          <div ref={wrapRef} className="flex-1 overflow-hidden"
            onPointerDown={onPointerDown} onPointerMove={onPointerMove}
            onPointerUp={onPointerUp} onPointerCancel={onPointerUp}
            style={{ touchAction: "pan-y", cursor: "grab",
            maskImage: isMobile ? "linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%)" : "linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%)",

            paddingTop: "12px", paddingBottom: "12px"

              {items.map((c, i) => (

                  style={{ cursor: "pointer" }}>
                  <img src={c.img} alt={c.name} loading="eager" referrerPolicy="no-referrer" onError={(e) => { const t = e.currentTarget; const n = Number(t.dataset.retry || 0); if (n < 3) { t.dataset.retry = n + 1; setTimeout(() => { t.src = c.img + (c.img.includes("?") ? "&" : "?") + "r=" + Date.now(); }, 600 * (n + 1)); } }} className="w-[68px] h-[68px] md:w-[116px] md:h-[116px] rounded-full object-cover" style={{ border: "1.5px solid rgba(255,255,255,0.2)" }} />
                  <div className="text-center">
                    <p className="text-white font-body font-medium text-sm md:text-base leading-tight">{c.name}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <ArrowBtn dir={1} />
        </div>
      );
    }

    function OurWorkRow({ images, reverse, speed, paused, onOpen }) {
      const items = [...images, ...images, ...images];
      const trackRef = useRef(null);
      const rampRef = useRef(null);
      const rampTo = (target) => {
        if (window.matchMedia("(hover: none), (pointer: coarse)").matches) return;
        cancelAnimationFrame(rampRef.current);
        const anims = trackRef.current ? trackRef.current.getAnimations() : [];
        if (!anims.length) return;
        const step = () => {
          let done = true;
          anims.forEach(a => {
            const r = a.playbackRate ?? 1;
            const next = r + (target - r) * 0.12;
            if (Math.abs(target - next) > 0.005) done = false;
            a.updatePlaybackRate(done ? target : next);
          });
          if (!done) rampRef.current = requestAnimationFrame(step);
        };
        step();
      };
      useEffect(() => () => cancelAnimationFrame(rampRef.current), []);

      // Touch: scrub the marquee 1:1 with the finger, resume where it was let go
      const drag = useRef({ x: 0, y: 0, active: false, moved: false });
      const onTouchStart = (e) => {
        const t = e.touches[0];
        drag.current = { x: t.clientX, y: t.clientY, active: false, moved: false };
      };
      const onTouchMove = (e) => {
        if (!trackRef.current) return;
        const t = e.touches[0];
        const dx = drag.current.x - t.clientX;
        const dy = Math.abs(drag.current.y - t.clientY);
        if (!drag.current.active) {
          if (Math.abs(dx) < 8 || dy > Math.abs(dx)) return; // let the page scroll vertically
          drag.current.active = true;
          trackRef.current.getAnimations().forEach(a => a.pause());
        }
        drag.current.moved = true;
        e.preventDefault();
        const w = trackRef.current.scrollWidth / 3;
        trackRef.current.getAnimations().forEach(a => {
          const dur = a.effect.getTiming().duration;
          const dir = reverse ? -1 : 1;
          a.currentTime = ((a.currentTime + dir * (dx / w) * dur) % dur + dur) % dur;
        });
        drag.current.x = t.clientX;
      };
      const onTouchEnd = () => {
        if (trackRef.current) trackRef.current.getAnimations().forEach(a => a.play());
        drag.current.active = false;
      };

      return (
        <div className="overflow-hidden" style={{ touchAction: "pan-y" }}
          onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd} onTouchCancel={onTouchEnd}
          onMouseEnter={() => rampTo(0.35)} onMouseLeave={() => rampTo(1)}>
          <div ref={trackRef} className="flex gap-4 ow-track" style={{ width: "max-content", animation: `ow-scroll-${reverse ? "rev" : "fwd"} ${speed} linear infinite`, animationPlayState: paused ? "paused" : "running" }}>

                onClick={(e) => { if (drag.current.moved) { drag.current.moved = false; return; } onOpen && onOpen(src, e.currentTarget.getBoundingClientRect()); }}
                onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onOpen && onOpen(src, e.currentTarget.getBoundingClientRect()); } }}
                className="flex-shrink-0 rounded-xl overflow-hidden w-[220px] h-[124px] md:w-[280px] md:h-[158px] cursor-pointer"
                style={{ transition: "transform var(--d-press) var(--ease-out)" }}

                <img src={src} alt="" className="w-full h-full object-cover" />

    function ContactForm() {
      const [form, setForm] = useState({ name: "", email: "", message: "" });
      const [sent, setSent] = useState(false);
      const [leaving, setLeaving] = useState(false);
      const [landed, setLanded] = useState(false);
      useEffect(() => { if (sent) requestAnimationFrame(() => requestAnimationFrame(() => setLanded(true))); }, [sent]);
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState("");
      const handle = (e) => setForm({ ...form, [e.target.name]: e.target.value });
      const submit = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        setError("");
        try {
          const res = await fetch("https://formspree.io/f/mkoernla", {
            method: "POST",
            headers: { "Accept": "application/json", "Content-Type": "application/json" },
            body: JSON.stringify(form),
          });
          if (res.ok) {
            setLeaving(true);
            setTimeout(() => setSent(true), 200);
          } else {
            const data = await res.json().catch(() => ({}));
            setError(data.error || "Something went wrong. Please try again.");
          }
        } catch (err) {
          setError("Network error. Please try again.");
        } finally {
          setSubmitting(false);
        }
      };
      const inputStyle = { background: "rgba(255,255,255,0.07)", border: "1.4px solid rgba(255,255,255,0.15)", borderRadius: "14px", color: "white", padding: "14px 18px", width: "100%", outline: "none", fontFamily: "'Barlow', sans-serif", fontSize: "14px", transition: "border-color var(--d-ui) var(--ease-out)" };
      return (
        <section id="contact" className="relative z-10 py-16 md:py-28 px-6 md:px-12 lg:px-24 bg-black">
          <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-stretch">
            <FadeIn className="text-center lg:text-left flex flex-col">
              <h2 className="text-4xl md:text-5xl lg:text-6xl text-white leading-[1.02]" style={{ fontFamily: "'alfabet', 'Inter', sans-serif", fontWeight: 700, letterSpacing: "-0.03em" }}>Let's talk.</h2>
              <div className="flex flex-col mt-10">
                <div className="border-t border-white/15 py-6">
                  <p className="text-white text-xl md:text-2xl" style={{ fontFamily: "'alfabet', 'Inter', sans-serif", fontWeight: 700, letterSpacing: "-0.03em" }}>Studio</p>
                  <p className="text-white/60 font-body font-light text-sm mt-1.5">Via Fabio Filzi 16, Canegrate (MI)</p>
                </div>
                <div className="border-t border-white/15 py-6">
                  <p className="text-white text-xl md:text-2xl" style={{ fontFamily: "'alfabet', 'Inter', sans-serif", fontWeight: 700, letterSpacing: "-0.03em" }}>Mail</p>
                  <a href="mailto:info.latostudio@gmail.com" className="text-white/60 font-body font-light text-sm mt-1.5 inline-flex items-center gap-1.5 hover:text-white transition-colors">info.latostudio@gmail.com <span aria-hidden="true">&#8594;</span></a>
                </div>
                <div className="border-t border-white/15 pt-6">
                  <p className="text-white text-xl md:text-2xl" style={{ fontFamily: "'alfabet', 'Inter', sans-serif", fontWeight: 700, letterSpacing: "-0.03em" }}>Follow</p>
                  <div className="flex items-center gap-3 mt-4 justify-center lg:justify-start">
                    {[
                      ["Instagram", "https://www.instagram.com/lato__studio/", "M12 2.2c3.2 0 3.6 0 4.9.07 1.2.06 1.8.25 2.2.42.6.23 1 .5 1.4.94.44.44.7.84.94 1.4.17.44.36 1.06.42 2.2.06 1.3.07 1.7.07 4.9s0 3.6-.07 4.9c-.06 1.2-.25 1.8-.42 2.2a3.8 3.8 0 0 1-.94 1.4c-.44.44-.84.7-1.4.94-.44.17-1.06.36-2.2.42-1.3.06-1.7.07-4.9.07s-3.6 0-4.9-.07c-1.2-.06-1.8-.25-2.2-.42a3.8 3.8 0 0 1-1.4-.94 3.8 3.8 0 0 1-.94-1.4c-.17-.44-.36-1.06-.42-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.07-4.9c.06-1.2.25-1.8.42-2.2.23-.6.5-1 .94-1.4.44-.44.84-.7 1.4-.94.44-.17 1.06-.36 2.2-.42C8.4 2.2 8.8 2.2 12 2.2Zm0 3.2a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2Zm0 10.9a4.3 4.3 0 1 1 0-8.6 4.3 4.3 0 0 1 0 8.6Zm8.4-11.2a1.54 1.54 0 1 1-3.08 0 1.54 1.54 0 0 1 3.08 0Z"],
                      ["TikTok", "https://tiktok.com", "M16.6 2h-3.1v13.2a2.6 2.6 0 1 1-2.6-2.6c.27 0 .53.04.78.12V9.5a5.9 5.9 0 1 0 5 5.83V8.9a6.5 6.5 0 0 0 3.8 1.22V6.94a3.4 3.4 0 0 1-3.4-3.4V2Z"],
                      ["LinkedIn", "https://www.linkedin.com/company/lato-studio-youtube-agency/", "M6.94 8.9H3.9V21h3.04V8.9ZM5.42 3a1.77 1.77 0 1 0 0 3.54 1.77 1.77 0 0 0 0-3.54ZM20.1 13.6c0-3.2-1.7-4.9-4-4.9-1.7 0-2.6.9-3.05 1.6V8.9H10V21h3.05v-6.5c0-1.5.7-2.4 1.9-2.4s1.85.85 1.85 2.4V21h3.3v-7.4Z"],
                    ].map(([label, href, d]) => (
                      <a key={label} href={href} target="_blank" rel="noopener noreferrer" aria-label={label}
                        className="liquid-glass-strong rounded-full flex items-center justify-center hover:bg-white/10 transition-colors"
                        style={{ width: "46px", height: "46px" }}>
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="white"><path d={d} /></svg>
                      </a>
                    ))}
                  </div>
                </div>
              </div>
            </FadeIn>
            <div className="flex flex-col h-full">
            {sent ? (
              <div className="liquid-glass rounded-2xl p-12 text-center" style={{
                opacity: landed ? 1 : 0,
                transform: landed ? "scale(1)" : "scale(0.97)",
                filter: landed ? "blur(0px)" : "blur(4px)",
                transition: "opacity var(--d-panel) var(--ease-out), transform var(--d-panel) var(--ease-out), filter var(--d-panel) var(--ease-out)"
              }}>
                <p className="text-white font-hero font-bold text-2xl mb-2">Message sent</p>
                <p className="text-white/60 font-body font-light text-sm">We'll get back to you shortly.</p>
              </div>
            ) : (
              <FadeIn delay={100} className="h-full">
                <form onSubmit={submit} className="liquid-glass rounded-2xl p-8 flex flex-col gap-4 h-full" style={{
                  opacity: leaving ? 0 : 1,
                  transform: leaving ? "scale(0.98)" : "scale(1)",
                  filter: leaving ? "blur(4px)" : "blur(0px)",
                  transition: "opacity 200ms var(--ease-out), transform 200ms var(--ease-out), filter 200ms var(--ease-out)"
                }}>
                  <input name="name" type="text" placeholder="Your Name" value={form.name} onChange={handle} required style={inputStyle} onFocus={e => e.target.style.borderColor="rgba(255,255,255,0.4)"} onBlur={e => e.target.style.borderColor="rgba(255,255,255,0.15)"} />
                  <input name="email" type="email" placeholder="Email" value={form.email} onChange={handle} required style={inputStyle} onFocus={e => e.target.style.borderColor="rgba(255,255,255,0.4)"} onBlur={e => e.target.style.borderColor="rgba(255,255,255,0.15)"} />
                  <textarea name="message" placeholder="Write your message" value={form.message} onChange={handle} required rows={5} className="flex-1" style={{ ...inputStyle, resize: "none", minHeight: "120px" }} onFocus={e => e.target.style.borderColor="rgba(255,255,255,0.4)"} onBlur={e => e.target.style.borderColor="rgba(255,255,255,0.15)"} />
                  {error && <p className="text-red-400 text-xs font-body">{error}</p>}
                  <button type="submit" disabled={submitting} className="w-full bg-white text-black font-hero font-bold text-sm rounded-2xl py-4 hover:bg-white/90 transition-colors mt-1 disabled:opacity-60 disabled:cursor-not-allowed">{submitting ? "Sending..." : "Submit"}</button>
                </form>
              </FadeIn>
            )}
            </div>
          </div>
        </section>
      );
    }

    // ── CtaFooter ─────────────────────────────────────────────────────────
    function CtaFooter() {
      return (
        <section className="relative overflow-hidden w-full" style={{ minHeight: "300px" }}>
          <HLSVideo src="https://stream.mux.com/8wrHPCX2dC3msyYU9ObwqNdm00u3ViXvOSHUMRYSEe5Q.m3u8" className="absolute inset-0 w-full h-full object-cover z-0" />
          <div className="absolute inset-0 z-0 pointer-events-none" style={{ background: "linear-gradient(to bottom, black 0%, transparent 200px)" }} />
          <div className="absolute inset-0 bg-black/40 z-0 pointer-events-none" />
          <div className="relative z-10 flex flex-col items-center justify-end h-full py-10 px-8 md:px-16" style={{ minHeight: "300px" }}>
            <div className="w-full flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-white/20 pt-8">
              <span className="text-white/70 text-sm font-body">© 2026 Lato Studio. All rights reserved.</span>
              <div className="flex items-center gap-8">
                {[["Privacy", "https://docs.google.com/document/d/e/2PACX-1vSi_s3iCmYRj27zoOjjz-pwakmUHzNVC82wTH9osaQNTcVG53--ljcPiQJFYIg8981EOiGxpU-4_RB6/pub"], ["Terms", "https://docs.google.com/document/d/e/2PACX-1vSCsHB4HkLZiIc9fi6ikjF-A5e5OdyjX2juNhEh77FtgkgTwI_rouEGeaAy_yooa_fdsQQRelustDks/pub"]].map(([link, href]) => (
                  <a key={link} href={href} target="_blank" rel="noopener noreferrer" className="text-white/60 text-sm font-body hover:text-white transition-colors">{link}</a>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ── App ───────────────────────────────────────────────────────────────
    function App() {
      return (
        <div className="bg-black min-h-screen">
          <div className="relative z-10">
            <Navbar />
            <Hero />
            <div className="bg-black">
              <FeaturesChess />
              <OurWork />
              <FAQ />
              <FeaturesGrid />
              <Stats />
              <Testimonials />
              <ContactForm />
              <CtaFooter />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
