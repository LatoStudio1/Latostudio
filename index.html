  <style>
    :root {

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    [id] { scroll-margin-top: 96px; }
    body { margin: 0; background: #0a0a0a; color: #fff; -webkit-font-smoothing: antialiased; }

    /* Flat surfaces (glass removed): one step off the page ground, hairline edge */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);

    /* Apple-style motion tokens: critically damped (no overshoot) + momentum (slight bounce) */
    :root {
      --spring: cubic-bezier(0.32, 0.72, 0, 1);          /* iOS drawer curve — gesture-driven surfaces */
      --spring-bounce: cubic-bezier(0.2, 1.25, 0.4, 1);  /* damping ~0.8, only after momentum */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);        /* entrances and exits */

    /* Feedback on pointer-down, never only on release */

    @media (prefers-reduced-motion: reduce) {

<body>
  <!-- Preloader: covers the first paint for at most ~1.6s, until fonts and the hero video are ready -->
  <div id="lato-preload" aria-hidden="true">
    <img src="uploads/brand/logo-lato-studio.png" alt="" width="150" height="34" />
    <div class="lp-bar"><span></span></div>
  </div>
  <noscript><style>#lato-preload { display: none !important; }</style></noscript>
  <div id="root"></div>
  <script>
    (function () {
      var el = document.getElementById("lato-preload");
      var t0 = Date.now(), MIN = 450, MAX = 1600, done = false;
      function finish() {
        if (done) return; done = true;
        var wait = Math.max(0, MIN - (Date.now() - t0));
        setTimeout(function () {
          window.__latoReady = true;
          try { window.dispatchEvent(new Event("lato:ready")); } catch (e) {}
          el.classList.add("lp-done");
          setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 500);
        }, wait);
      }
      setTimeout(finish, MAX);
      var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      var video = new Promise(function (res) {
        var v = document.querySelector("#root video");
        if (!v) { window.addEventListener("load", res); return; }
        if (v.readyState >= 3) return res();
        v.addEventListener("canplay", res, { once: true });
        v.addEventListener("error", res, { once: true });
      });
      Promise.all([fonts, video]).then(finish, finish);
    })();
  </script>

  <script type="text/babel">
    const { useRef, useEffect, useState } = React;

    // ── Icons ──────────────────────────────────────────────────────────────
    function IconArrowUpRight({ size = 16, className = "" }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" /></svg>);

    function IconZap({ size = 20, className = "" }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>);
    }
    function IconPalette({ size = 20, className = "" }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="13.5" cy="6.5" r=".5" fill="currentColor" /><circle cx="17.5" cy="10.5" r=".5" fill="currentColor" /><circle cx="8.5" cy="7.5" r=".5" fill="currentColor" /><circle cx="6.5" cy="12.5" r=".5" fill="currentColor" /><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" /></svg>);
    }
    function IconBarChart3({ size = 20, className = "" }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18" /><path d="M18 17V9" /><path d="M13 17V5" /><path d="M8 17v-3" /></svg>);
    }
    function IconShield({ size = 20, className = "" }) {
      return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>);
    }

    // ── BlurText ───────────────────────────────────────────────────────────
    function BlurText({ text, className = "", delay = 120, tag = "span", rootMargin = "0px 0px -120px 0px", serifLast = false, serifWords = [], style = {} }) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setVisible(true); }, { threshold: 0.1, rootMargin });
        observer.observe(el);
        return () => observer.disconnect();
      }, []);
      const words = text.split(" ");
      const Tag = tag;
      return (
        <Tag ref={ref} className={className} style={{ display: "block", ...style }}>
          {words.map((word, i) => (
            <React.Fragment key={i}><span style={{ display: "inline-block", opacity: visible ? 1 : 0, filter: visible ? "blur(0px)" : "blur(12px)", transform: visible ? "translateY(0px)" : "translateY(30px)", transition: `opacity 0.55s var(--ease-out) ${i * delay}ms, filter 0.55s var(--ease-out) ${i * delay}ms, transform 0.55s var(--ease-out) ${i * delay}ms`, marginRight: 0, ...((serifLast && i === words.length - 1) || serifWords.includes(word) ? { fontFamily: "'Instrument Serif', serif", fontWeight: 400, fontStyle: "italic", fontSize: "1.1em", letterSpacing: "0.01em", position: "relative" } : {}) }}>
              {word}
            </span>{i < words.length - 1 ? " " : null}</React.Fragment>
          ))}
        </Tag>
      );
    }

    // ── CountUpText ────────────────────────────────────────────────────────
    function CountUpText({ value = 10000000000, suffix = "+", className = "", duration = 1900, inline = false }) {
      const ref = useRef(null);
      const [n, setN] = useState(0);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold: 0.1 });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      useEffect(() => {
        if (!visible) return;
        let raf, start;
        const step = (t) => {
          if (!start) start = t;
          const p = Math.min((t - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 7);
          setN(Math.floor(value * eased));
          if (p < 1) raf = requestAnimationFrame(step);
          else setN(value);
        };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [visible]);
      return (
        <span ref={ref} className={className} style={{ display: inline ? "inline-block" : "block", position: "relative", textAlign: "center", fontVariantNumeric: "tabular-nums", opacity: visible ? 1 : 0, filter: visible ? "blur(0px)" : "blur(10px)", transition: "opacity 1.1s cubic-bezier(0.22,1,0.36,1), filter 1.1s cubic-bezier(0.22,1,0.36,1)" }}>
          <span style={{ visibility: "hidden" }}>{value.toLocaleString("de-DE")}{suffix}</span>
          <span style={{ position: "absolute", left: 0, right: 0, top: 0, textAlign: "center", whiteSpace: "nowrap" }}>
            {n.toLocaleString("de-DE")}
            <span style={{ opacity: n >= value ? 1 : 0, transition: "opacity var(--d-ui) var(--ease-out)" }}>{suffix}</span>
          </span>
        </span>
      );
    }

    // ── useIsMobile ────────────────────────────────────────────────────────
    function useIsMobile(bp = 768) {
      const [m, setM] = useState(() => window.innerWidth < bp);
      useEffect(() => {
        const mq = window.matchMedia(`(max-width: ${bp - 1}px)`);
        const on = (e) => setM(e.matches);
        mq.addEventListener("change", on);
        return () => mq.removeEventListener("change", on);
      }, [bp]);
      return m;
    }

    // ── FadeIn ─────────────────────────────────────────────────────────────
    // Nothing below the hero may arrive before the hero's own sequence has finished.
    const HERO_SETTLED = 2600; // ms after load: hero's last element lands at ~2100, then a beat
    const startedAt = performance.now();

    function FadeIn({ children, delay = 0, className = "", threshold = 0.1, rootMargin = "0px 0px -80px 0px" }) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        let timer;
        const observer = new IntersectionObserver(([entry]) => {
          if (!entry.isIntersecting) return;
          const wait = HERO_SETTLED - (performance.now() - startedAt);
          if (wait > 0) timer = setTimeout(() => setVisible(true), wait);
          else setVisible(true);
        }, { threshold, rootMargin });
        observer.observe(el);
        return () => { observer.disconnect(); clearTimeout(timer); };
      }, []);
      return (
        <div ref={ref} className={className} style={{ opacity: visible ? 1 : 0, transition: `opacity var(--d-enter) var(--ease-out) ${delay}ms` }}>
          {children}
        </div>
      );
    }

    // ── HLSVideo ───────────────────────────────────────────────────────────
    function HLSVideo({ src, className = "", desaturate = false, style = {}, poster }) {
      const videoRef = useRef(null);
      const [near, setNear] = useState(false);
      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) { setNear(true); video.play().catch(() => {}); }
          else video.pause();
        }, { rootMargin: "300px 0px" });
        obs.observe(video);
        return () => obs.disconnect();
      }, []);
      useEffect(() => {
        const video = videoRef.current;
        if (!video || !near) return;
        if (window.Hls && window.Hls.isSupported()) {
          const hls = new window.Hls({ autoStartLoad: true, lowLatencyMode: false });
          hls.loadSource(src);
          hls.attachMedia(video);
          hls.on(window.Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
          return () => hls.destroy();
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = src;
          video.play().catch(() => {});
        }
      }, [src, near]);
      return (<video ref={videoRef} loop muted playsInline preload="none" poster={poster} className={className} style={{ ...(desaturate ? { filter: "saturate(0)" } : {}), ...style }} />);
    }

    // ── SectionBadge ──────────────────────────────────────────────────────
    function SectionBadge({ children }) {
      return (<span className="liquid-glass rounded-full px-3.5 py-1 text-xs font-bold text-white font-hero inline-block tracking-wide uppercase">{children}</span>);
    }

    // ── Navbar ─────────────────────────────────────────────────────────────
    function Navbar() {
      const [active, setActive] = useState("Home");
      const pillWrapRef = useRef(null);
      const [pill, setPill] = useState({ left: 0, width: 0 });
      useEffect(() => {
        const measure = () => {
          const wrap = pillWrapRef.current;
          if (!wrap) return;
          const el = wrap.querySelector(`[data-nav="${active}"]`);
          if (!el) return;
          setPill({ left: el.offsetLeft, width: el.offsetWidth });
        };
        measure();
        window.addEventListener("resize", measure);
        const t = setTimeout(measure, 300); // after webfonts settle
        return () => { window.removeEventListener("resize", measure); clearTimeout(t); };
      }, [active]);
      useEffect(() => {
        const sections = [["Home", null],["Services","capabilities"],["Portfolio","our-work"],["Contacts","contact"]];
        const onScroll = () => {
          const scrollY = window.scrollY + 120;
          const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 100;
          if (atBottom) { setActive("Contacts"); return; }
          let current = "Home";
          for (const [label, id] of sections) {
            if (!id) continue;
            const el = document.getElementById(id);
            if (el && el.offsetTop <= scrollY) current = label;
          }
          setActive(current);
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onS = () => setScrolled(window.scrollY > 40);
        onS();
        window.addEventListener("scroll", onS, { passive: true });
        return () => window.removeEventListener("scroll", onS);
      }, []);
      return (
        <nav className="fixed top-4 left-0 right-0 z-50 max-w-[88rem] mx-auto px-6 md:px-12 lg:px-16 flex items-center justify-between py-3">
          <span aria-hidden="true" className="absolute pointer-events-none" style={{
            left: "calc(50% - 50vw)", width: "100vw", top: "-16px", height: "120px", zIndex: -1,
            background: "linear-gradient(to bottom, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0.7) 45%, rgba(10,10,10,0) 100%)",
            opacity: scrolled ? 1 : 0, transition: "opacity var(--d-ui) var(--ease-out)"
          }} />
          <a href="#" onClick={(e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); }} className="flex items-center cursor-pointer">
            <img src="uploads/brand/logo-lato-studio.png" alt="Lato Studio" style={{ height: "34px", width: "auto", objectFit: "contain", display: "block" }} />
          </a>
          <div ref={pillWrapRef} className="hidden md:flex liquid-glass rounded-full px-1.5 py-1 items-center gap-1 relative">
            <span aria-hidden="true" style={{
              position: "absolute", top: "4px", bottom: "4px", left: 0, width: `${pill.width}px`,
              transform: `translateX(${pill.left}px)`, background: "#fff", borderRadius: "9999px",
              opacity: pill.width ? 1 : 0, pointerEvents: "none",
              transition: "transform var(--d-ui) var(--ease-in-out), width var(--d-ui) var(--ease-in-out), opacity var(--d-ui) var(--ease-out)"
            }} />

    function CreatorsCarousel() {
      const items = [...creators, ...creators, ...creators];
      const trackRef = useRef(null);
      const wrapRef = useRef(null);
      const pos = useRef(0);   // wrapped position, always inside one copy
      const rem = useRef(0);   // distance still to travel (can be negative)
      const vel = useRef(0);   // px per second
      const rafRef = useRef(null);
      const isMobile = window.innerWidth < 768;
      const drift = useRef(1);        // auto-scroll rate multiplier (hover slows it down)
      const driftTarget = useRef(1);
      const touching = useRef(false);
      const boost = useRef(0);       // extra speed left over from a swipe, fades out

      // one card + its gap, measured with sub-pixel precision
      const pitch = () => {
        const t = trackRef.current;
        if (!t || t.children.length < 2) return 240;
        const a = t.children[0].getBoundingClientRect();
        const b = t.children[1].getBoundingClientRect();
        return b.left - a.left;
      };
      // every press adds exactly one card, then the landing is aligned to a boundary
      const scroll = (dir) => {
        const p = pitch();
        if (p <= 0) return;
        const cap = p * 6;
        let r = rem.current + dir * p;
        const landing = pos.current + r;
        r += Math.round(landing / p) * p - landing;   // land on a card edge
        rem.current = Math.max(-cap, Math.min(cap, r));
      };
      const snap = () => {
        const p = pitch();
        if (p <= 0) return;
        const off = ((pos.current % p) + p) % p;
        rem.current = off > p / 2 ? (p - off) : -off;
      };

      // Pointer drag: works with a mouse in a narrow window and with a finger
      const pdrag = useRef({ id: null, x: 0, active: false });
      const onPointerDown = (e) => {
        if (e.pointerType === "touch") return; // touch is handled below, 1:1
        pdrag.current = { id: e.pointerId, x: e.clientX, active: true };
        e.currentTarget.setPointerCapture(e.pointerId);
      };
      const onPointerMove = (e) => {
        if (!pdrag.current.active || e.pointerId !== pdrag.current.id) return;
        if (e.buttons === 0) { onPointerUp(e); return; } // button already released
        const dx = pdrag.current.x - e.clientX;
        if (Math.abs(dx) > 400) { pdrag.current.x = e.clientX; return; } // ignore teleports
        pos.current += dx;   // the finger moves it directly
        rem.current = 0;
        vel.current = 0;
        pdrag.current.x = e.clientX;
      };
      const onPointerUp = (e) => {
        if (!pdrag.current.active) return;
        pdrag.current.active = false;
        snap();
        try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
      };
      useEffect(() => {
        const stop = () => { if (pdrag.current.active) { pdrag.current.active = false; snap(); } };
        window.addEventListener("pointerup", stop);
        window.addEventListener("blur", stop);
        return () => { window.removeEventListener("pointerup", stop); window.removeEventListener("blur", stop); };
      }, []);

      useEffect(() => {
        let touchStartX = 0, touchStartY = 0, isSwiping = false, lastT = 0;
        // Touch (phones): a swipe moves the carousel either way.
        // The finger moves it 1:1, and on release the swipe speed carries on and fades out.
        let lastMoveT = 0, swipeVel = 0;
        const onTouchStart = (e) => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; isSwiping = false; swipeVel = 0; lastMoveT = performance.now(); };
        const onTouchMove = (e) => {
          const x = e.touches[0].clientX;
          const dx = touchStartX - x;              // > 0 = finger moving left = forward
          const dy = Math.abs(touchStartY - e.touches[0].clientY);
          if (!isSwiping && (Math.abs(dx) < 6 || dy > Math.abs(dx))) return; // vertical: let the page scroll
          isSwiping = true;
          touching.current = true;
          e.preventDefault();
          const now = performance.now();
          const fwd = dx;
          pos.current += fwd;
          const ms = Math.max(now - lastMoveT, 8);
          swipeVel = swipeVel * 0.6 + (fwd / ms) * 1000 * 0.4;
          lastMoveT = now;
          touchStartX = x;
        };
        const onTouchEnd = () => {
          if (isSwiping && performance.now() - lastMoveT < 120) boost.current = Math.max(-4000, Math.min(swipeVel, 4000));
          touching.current = false;
          isSwiping = false;
        };

        const period = () => {
          const t = trackRef.current;
          if (!t || t.children.length < creators.length + 1) return 0;
          const a = t.children[0].getBoundingClientRect();
          const b = t.children[creators.length].getBoundingClientRect();
          return b.left - a.left; // exact width of one copy, gap included
        };

        const animate = () => {
          if (!isFinite(rem.current)) rem.current = 0;
          if (!isFinite(pos.current)) pos.current = 0;
          // spring toward the remaining distance: fast start, settles in ~300ms,
          // and a new press just adds to it — the velocity carries over
          const now = performance.now();
          const dt = Math.min((now - (lastT || now)) / 1000, 1 / 30);
          lastT = now;
          if (Math.abs(rem.current) > 0.3 || Math.abs(vel.current) > 0.3) {
            vel.current += (rem.current * 220 - vel.current * 30) * dt;
            const step = vel.current * dt;
            pos.current += step;
            rem.current -= step;
          } else if (rem.current !== 0 || vel.current !== 0) {
            pos.current += rem.current;
            rem.current = 0;
            vel.current = 0;
          }
          // continuous drift, like the thumbnail rows; pauses while dragging or touching
          drift.current += (driftTarget.current - drift.current) * 0.08;

        };

        el.addEventListener("touchstart", onTouchStart, { passive: true });
        el.addEventListener("touchend", onTouchEnd, { passive: true });
        el.addEventListener("touchcancel", onTouchEnd, { passive: true });
        el.addEventListener("touchmove", onTouchMove, { passive: false });
        rafRef.current = requestAnimationFrame(animate);
        return () => {
          el.removeEventListener("touchstart", onTouchStart);
          el.removeEventListener("touchend", onTouchEnd);
          el.removeEventListener("touchcancel", onTouchEnd);
          el.removeEventListener("touchmove", onTouchMove);
          cancelAnimationFrame(rafRef.current);
        };
      }, []);


      return (
        <div className="w-full flex items-center gap-4 px-4 md:px-8">
          <div ref={wrapRef} className="flex-1 overflow-hidden"
            onMouseEnter={() => { if (!window.matchMedia("(hover: none), (pointer: coarse)").matches) driftTarget.current = 0.35; }}

          </div>
        </div>

    }

        const prep = (v) => {
          v.muted = true; v.defaultMuted = true;
          v.setAttribute("muted", ""); v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
          v.controls = false;
        };
        const tryPlay = (v) => {
          prep(v);
          if (v.preload === "none") { v.preload = "auto"; v.load(); }
          const p = v.play();
          if (p && p.catch) p.catch(() => {});
        };
        vids.forEach(prep);
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            const v = e.target;
            if (e.isIntersecting) { visible.add(v); tryPlay(v); }
            else { visible.delete(v); v.pause(); }
          });
        }, { rootMargin: "200px 0px" });
        vids.forEach((v) => obs.observe(v));
        // Low Power Mode blocks autoplay until the first gesture — resume then
        const kick = () => visible.forEach((v) => { if (v.paused) tryPlay(v); });
        window.addEventListener("touchstart", kick, { passive: true });
        window.addEventListener("scroll", kick, { passive: true });
        return () => {
          obs.disconnect();
          window.removeEventListener("touchstart", kick);
          window.removeEventListener("scroll", kick);
        };

      ];
      const isMobile = useIsMobile();
      const scrollerRef = useRef(null);
      const [canLeft, setCanLeft] = useState(false);
      const [canRight, setCanRight] = useState(true);

      const updateArrows = () => {
        const el = scrollerRef.current;
        if (!el) return;
        setCanLeft(el.scrollLeft > 5);
        setCanRight(el.scrollLeft < el.scrollWidth - el.clientWidth - 5);
      };

      useEffect(() => {
        const el = scrollerRef.current;
        if (!el) return;
        updateArrows();
        el.addEventListener("scroll", updateArrows, { passive: true });
        window.addEventListener("resize", updateArrows);
        return () => {
          el.removeEventListener("scroll", updateArrows);
          window.removeEventListener("resize", updateArrows);
        };
      }, []);

      const scrollBy = (dir) => {
        const el = scrollerRef.current;
        if (!el) return;
        el.scrollBy({ left: dir * (el.clientWidth * 0.8), behavior: "smooth" });
      };

      // Drag the strip directly — the arrows are hidden below md
      const tdrag = useRef({ id: null, x: 0, left: 0, active: false, moved: false });
      const onPointerDown = (e) => {
        if (e.pointerType === "touch") return; // native touch scrolling already works
        const el = scrollerRef.current;
        if (!el) return;
        tdrag.current = { id: e.pointerId, x: e.clientX, left: el.scrollLeft, active: true, moved: false };
        el.setPointerCapture(e.pointerId);
        el.style.scrollSnapType = "none";
      };
      const onPointerMove = (e) => {
        const el = scrollerRef.current;
        if (!el || !tdrag.current.active || e.pointerId !== tdrag.current.id) return;
        const dx = e.clientX - tdrag.current.x;
        if (Math.abs(dx) > 4) tdrag.current.moved = true;
        el.scrollLeft = tdrag.current.left - dx;
      };
      const onPointerUp = (e) => {
        const el = scrollerRef.current;
        if (!el || !tdrag.current.active) return;
        tdrag.current.active = false;
        el.style.scrollSnapType = "x mandatory";
        try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      };

      const ArrowBtn = ({ dir, disabled }) => (
        <button onClick={() => scrollBy(dir)} disabled={disabled}
          className="hidden md:flex liquid-glass-strong rounded-full items-center justify-center flex-shrink-0"
          style={{ width: "44px", height: "44px", minWidth: "44px", opacity: disabled ? 0.3 : 1, cursor: disabled ? "default" : "pointer", transition: "opacity var(--d-ui) var(--ease-out), background-color var(--d-ui) var(--ease-out)" }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            {dir === -1 ? <polyline points="15 18 9 12 15 6"/> : <polyline points="9 6 15 12 9 18"/>}
          </svg>
        </button>
      );

      return (
        <section className="relative z-10 py-14 md:py-24 px-6 md:px-12 lg:px-16">
          <div className="max-w-7xl mx-auto">
            <FadeIn className="text-center mb-12 md:mb-16">

            <div className="flex items-center gap-3 md:gap-4">
              <ArrowBtn dir={-1} disabled={!canLeft} />
              <div ref={scrollerRef} className="flex-1 flex gap-6 overflow-x-auto"
                onPointerDown={onPointerDown} onPointerMove={onPointerMove}
                onPointerUp={onPointerUp} onPointerCancel={onPointerUp}
                style={{ cursor: "grab", scrollSnapType: "x mandatory", scrollbarWidth: "none", msOverflowStyle: "none", touchAction: "pan-x pan-y", WebkitOverflowScrolling: "touch", overscrollBehaviorX: "contain" }}>
                <style>{`section .flex-1.overflow-x-auto::-webkit-scrollbar { display: none; }`}</style>
                {testimonials.map((item, i) => (
                  <div key={i} className="liquid-glass rounded-2xl p-6 md:p-8 flex flex-col gap-5 flex-shrink-0" style={{ width: isMobile ? "78%" : "calc(33.333% - 1rem)", minWidth: "240px", scrollSnapAlign: "start" }}>
                    <div className="flex items-center gap-3">
                      <img src={item.img} alt={item.name} loading="lazy" decoding="async" className="w-12 h-12 rounded-full flex-shrink-0" style={{ border: "1.5px solid rgba(255,255,255,0.2)", objectFit: item.contain ? "contain" : "cover", background: item.contain ? "rgba(255,255,255,0.06)" : "transparent", padding: item.contain ? "4px" : 0 }} />
                      <p className="text-white font-body font-medium text-sm">{item.name}</p>
                    </div>
                    <p className="text-white/80 font-body font-light text-sm leading-relaxed flex-1">{item.quote}</p>
                  </div>
                ))}
              </div>
              <ArrowBtn dir={1} disabled={!canRight} />
            </div>
          </div>
        </section>
      );

                transform: landed ? "scale(1)" : "scale(0.97)",
                filter: landed ? "blur(0px)" : "blur(4px)",
                transition: "opacity var(--d-panel) var(--ease-out), transform var(--d-panel) var(--ease-out), filter var(--d-panel) var(--ease-out)"
              }}>
                <p className="text-white font-hero font-bold text-2xl mb-2">Message sent</p>
                <p className="text-white/60 font-body font-light text-sm">We'll get back to you shortly.</p>
              </div>
            ) : (
              <FadeIn delay={100} className="h-full">
                <form onSubmit={submit} className="liquid-glass rounded-2xl p-8 flex flex-col gap-4 h-full" style={{
                  opacity: leaving ? 0 : 1,
                  transform: leaving ? "scale(0.98)" : "scale(1)",
                  filter: leaving ? "blur(4px)" : "blur(0px)",
                  transition: "opacity 200ms var(--ease-out), transform 200ms var(--ease-out), filter 200ms var(--ease-out)"
                }}>
                  <input name="name" type="text" autoComplete="name" aria-label="Your name" placeholder="Your Name" value={form.name} onChange={handle} required style={inputStyle} onFocus={e => e.target.style.borderColor="rgba(255,255,255,0.4)"} onBlur={e => e.target.style.borderColor="rgba(255,255,255,0.15)"} />
                  <input name="email" type="email" autoComplete="email" aria-label="Email" placeholder="Email" value={form.email} onChange={handle} required style={inputStyle} onFocus={e => e.target.style.borderColor="rgba(255,255,255,0.4)"} onBlur={e => e.target.style.borderColor="rgba(255,255,255,0.15)"} />
                  <input name="channel" type="text" inputMode="url" aria-label="Your channel link (optional)" placeholder="Your channel link (optional)" value={form.channel} onChange={handle} style={inputStyle} onFocus={e => e.target.style.borderColor="rgba(255,255,255,0.4)"} onBlur={e => e.target.style.borderColor="rgba(255,255,255,0.15)"} />
                  <textarea name="message" aria-label="Your message" placeholder="Write your message" value={form.message} onChange={handle} required rows={5} className="flex-1" style={{ ...inputStyle, resize: "none", minHeight: "120px" }} onFocus={e => e.target.style.borderColor="rgba(255,255,255,0.4)"} onBlur={e => e.target.style.borderColor="rgba(255,255,255,0.15)"} />
                  <p className="font-body font-normal text-xs leading-relaxed text-center" style={{ color: "rgba(255,255,255,0.72)", textWrap: "pretty" }}>
                    We use your name, email address and message to respond to your enquiry.<br />Read our <a href="privacy" className="underline hover:text-white transition-colors" style={{ color: "rgba(255,255,255,0.9)" }}>Privacy Policy</a> for details.
                  </p>
                  {error && <p className="text-red-400 text-xs font-body">{error}</p>}
                  <button type="submit" disabled={submitting} className="w-full bg-white text-black font-hero font-bold text-sm rounded-2xl py-4 hover:bg-white/90 transition-colors mt-1 disabled:opacity-60 disabled:cursor-not-allowed">{submitting ? "Sending..." : "Submit"}</button>
                </form>
              </FadeIn>
            )}
            </div>
          </div>
        </section>
      );
    }

    // ── CtaFooter ─────────────────────────────────────────────────────────
    function CtaFooter() {
      return (
        <section className="relative overflow-hidden w-full" style={{ minHeight: "420px" }}>
          <video src="uploads/brand/liquid-bg.mp4?v=37" poster="uploads/brand/liquid-bg-poster.webp" autoPlay loop muted playsInline preload="none" data-lazyvid className="absolute inset-0 w-full h-full object-cover z-0" style={{ opacity: 0.32, filter: "blur(28px)", transform: "translateY(120px) scale(1.2)" }} />
          <div className="absolute inset-0 z-0 pointer-events-none" style={{ background: "linear-gradient(to bottom, #0a0a0a 0%, transparent 220px)" }} />
          <div className="absolute inset-0 bg-black/10 z-0 pointer-events-none" />
          <div className="relative z-10 flex flex-col items-center justify-end h-full py-10 px-6 md:px-12 lg:px-16 max-w-[88rem] mx-auto" style={{ minHeight: "420px" }}>
            <div className="w-full flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-white/20 pt-8">
              <span className="text-white/70 text-sm font-body">© 2026 Lato Studio. All rights reserved. VAT IT13483050962</span>
              <div className="flex items-center gap-8">
                {[["Privacy & Cookies", "privacy"], ["Terms", "terms"]].map(([link, href]) => (
                  <a key={link} href={href} className="text-white/60 text-sm font-body hover:text-white transition-colors">{link}</a>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ── App ───────────────────────────────────────────────────────────────
    function App() {
      useLazyVideos();
      return (
        <div className="min-h-screen">
          <div className="relative z-10">
            <Navbar />
            <Hero />
            <div>
              <FeaturesChess />
              <OurWork />
              <ContactForm />
              <CtaFooter />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
