# Deploys latostudio.it to GitHub Pages.
# Before publishing, build/prerender.cjs turns the page into ready-made HTML
# (full content for Google, AI tools and slow phones). If that step has any
# problem, the page is published exactly as it is in the repo.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prerender the page
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/prerender" typescript@5.6.3 react@18.3.1 react-dom@18.3.1 || echo "::warning::Could not install prerender tools"
          NODE_PATH="$RUNNER_TEMP/prerender/node_modules" node build/prerender.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
